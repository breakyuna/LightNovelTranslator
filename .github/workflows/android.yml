name: Build Android APK

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 单元测试、两个设备测试矩阵作业、Lint、Release 独立执行。
  # 当前仅由仓库分支 push / workflow_dispatch 触发，各 job 允许写回分支缓存。
  # setup-gradle 默认对非默认分支只读；显式开启写入，避免开发分支持续冷构建。
  # Robolectric 的 android-all 下载独立缓存在 ~/.m2/repository。
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Robolectric android-all jars
        id: robolectric-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: robolectric-android-all-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-android-all-${{ runner.os }}-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # maxParallelForks 由 app/build.gradle.kts 按 runner 核数设置（4 核 → 4 fork）。
      # in-process 编译策略只是本机 Termux 兜底，CI 用 daemon（独立 JVM + 热 JIT）。
      - name: Check native rebuild module boundaries
        run: python3 tools/rebuild/check_structure.py

      # Debug 固定版本号，避免每轮 GITHUB_RUN_NUMBER 改变 BuildConfig/清单使编译缓存失效。
      # 任务失败后继续执行依赖正常的其他模块；最终仍以非零退出码报告失败。
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core:domain:test :core:engine:test -Plnt.versionCode=7 --continue --profile -Pkotlin.compiler.execution.strategy=daemon

      # 测试失败也保留已下载的依赖，后续修复无需重新下载。
      - name: Save Robolectric android-all jars
        if: ${{ !cancelled() && steps.robolectric-cache.outcome == 'success' && steps.robolectric-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: ${{ steps.robolectric-cache.outputs.cache-primary-key }}

      - name: Upload unit test and build timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
            core/**/build/test-results/
            core/**/build/reports/tests/
            core/storage/schemas/
            app/src/test/screenshots/native-*.png
            build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  device-test:
    name: device-test (${{ matrix.label }}, API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # 一个模块失败不取消另一个模块的模拟器测试。
      fail-fast: false
      matrix:
        include:
          - label: app
            task: :app:connectedDebugAndroidTest
            report-root: app/build
          - label: workspace
            task: :core:workspace:connectedDebugAndroidTest
            report-root: core/workspace/build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew ${{ matrix.task }} -Plnt.versionCode=7 --continue --profile -Pkotlin.compiler.execution.strategy=daemon

      - name: Upload device test and build timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ matrix.report-root }}/outputs/androidTest-results/
            ${{ matrix.report-root }}/reports/androidTests/
            build/reports/profile/
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lintDebug -Plnt.versionCode=7 --info --console=plain --profile -Pkotlin.compiler.execution.strategy=daemon

      # --info 保留缓存未命中的原因；摘要直接展示最慢任务，完整 profile 仍上传。
      - name: Summarize lint task timings
        if: always()
        run: python3 tools/ci/gradle_profile_summary.py build/reports/profile >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lint and build timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-*.xml
            core/**/build/reports/lint-results-*.xml
            build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for var in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::$var is not configured"
              exit 1
            fi
          done

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Validate and pin signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_SIGNING_CERT_SHA256: a59e9fb8281cfcf48e2daf42ea55d9339ba7f049f536e6772996e8ddc5951946
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          keytool -exportcert \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/signing-cert.der" \
            >/dev/null

          ACTUAL_SIGNING_CERT_SHA256="$(sha256sum "$RUNNER_TEMP/signing-cert.der" | awk '{print $1}')"
          if [ "$ACTUAL_SIGNING_CERT_SHA256" != "$EXPECTED_SIGNING_CERT_SHA256" ]; then
            echo "::error::Signing certificate changed unexpectedly"
            echo "Expected: $EXPECTED_SIGNING_CERT_SHA256"
            echo "Actual:   $ACTUAL_SIGNING_CERT_SHA256"
            exit 1
          fi
          echo "Pinned signing certificate SHA-256: $ACTUAL_SIGNING_CERT_SHA256"

      - name: Build signed Release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pkotlin.compiler.execution.strategy=daemon --profile

      - name: Upload release build timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Resolve artifact name
        run: echo "ARTIFACT_NAME=LightNovelTranslator-${GITHUB_REF_NAME//\//-}-signed" >> "$GITHUB_ENV"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
